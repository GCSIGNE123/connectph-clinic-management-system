[project]
name = "connectph-clinic-backend"
version = "1.7.0-rc1"
description = "CONNECT.PH Clinic Platform - Multi-tenant Medical Clinic Management SaaS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.1.1",
    "passlib[argon2]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "redis>=5.0.4",
    "python-dotenv==1.0.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.4",
    "black>=24.4.2",
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
]
# Post-RC1 Phase 2.5: Production Cloud Deployment - production WSGI/ASGI
# process manager. `uvicorn app.main:app --reload` (dev) is not intended for
# production; a VPS deployment runs Gunicorn managing Uvicorn worker
# processes instead (see deploy/connectph-backend.service, DEPLOYMENT.md).
prod = [
    "gunicorn>=22.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
pythonpath = ["."]
