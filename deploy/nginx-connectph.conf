# CONNECT.PH Clinic Platform - example Nginx reverse-proxy config.
# Backend (FastAPI/uvicorn workers via gunicorn, see connectph-backend.service)
# listens on 127.0.0.1:8000. Frontend is deployed separately on Vercel and is
# NOT proxied here - this config is for the API subdomain only.
#
# Install: copy to /etc/nginx/sites-available/connectph, symlink into
# sites-enabled, `nginx -t`, `systemctl reload nginx`. Obtain the certificate
# first with certbot (see DEPLOYMENT.md) - certbot's Nginx plugin will
# rewrite the server block below to add the actual `ssl_certificate` lines;
# what's shown here is the pre-certbot / manual-cert-path shape.

server {
    listen 80;
    server_name clinic-api.connectph-it.com;

    # certbot's HTTP-01 challenge path (kept reachable even after HTTPS is
    # otherwise forced, for renewal):
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name clinic-api.connectph-it.com;

    ssl_certificate     /etc/letsencrypt/live/clinic-api.connectph-it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic-api.connectph-it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;  # attachments/lab result uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (queue/messaging realtime endpoints)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cheap, no-auth load-balancer / uptime health check target.
    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
