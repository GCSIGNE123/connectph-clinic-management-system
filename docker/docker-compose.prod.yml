version: "3.9"

# Production override for the clinic Server PC deployment (Phase 3).
#
# This file is layered ON TOP of docker/docker-compose.yml, which is
# unchanged and remains the dev-oriented base (bind mounts, dev CORS
# default, etc.). Usage (from repo root):
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml build backend frontend
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --no-deps backend frontend
#
# (deploy.cmd at the repo root runs exactly this.)
#
# What this override changes, and why (see docs/PHASE2_DEPLOYMENT_DESIGN
# notes / Phase 2 audit findings for the full reasoning):
#
# - backend.volumes: !override [backend_var_data:/app/var] - removes the
#   base file's dev bind mount (../backend:/app) and replaces it with a
#   named volume for /app/var only. `!override` (not the earlier `!reset
#   []`) since we're replacing the field with a specific new value, not
#   clearing it - same merge-control reasoning as `frontend.healthcheck.
#   test` below. Without removing the bind mount, the running container
#   would serve the HOST filesystem, not what was actually baked into the
#   image at `build` time - that defeats the entire point of a
#   Git-pull-then-rebuild deploy. In production the backend must run ONLY
#   from its built image.
#
#   The named volume matters for a separate reason: `/app/var` is where
#   real uploaded files are written - `POST /consultations/{id}/attachments`
#   (clinical images/PDFs, see `api/v1/consultations.py`) and TV Info
#   Content images (`api/v1/tv_display.py`) both store real bytes under
#   `var/`. Without a volume there, `backend.volumes: !reset []` alone
#   would leave `/app/var` living only in the container's writable layer -
#   every `docker compose build backend && up -d --no-deps backend` cycle
#   (exactly what `deploy.cmd` does on every deploy) discards that layer,
#   permanently deleting every previously-uploaded attachment/image on
#   every single deploy. `backend_var_data` (declared below) persists
#   across rebuilds/recreations the same way `postgres_data`/`redis_data`
#   already do for the database/cache.
#
# - backend.command - overrides the image's default CMD, which runs
#   `alembic upgrade head` before starting uvicorn. Per Phase 3
#   requirements, migrations must NEVER run automatically as part of a
#   deploy - they are a separate, deliberate, manual step. This override
#   starts uvicorn directly and skips the migration step entirely.
#
# - backend.environment: ENV / CORS_ORIGINS - these are the ACTUAL env var
#   names read by `backend/app/core/config.py`'s `Settings` (`ENV`,
#   `CORS_ORIGINS`). The base file sets `ENVIRONMENT`/`CORS_ALLOWED_ORIGINS`
#   instead, which `Settings` never reads (`extra="ignore"`) - those were
#   silently no-ops, so this override only sets the correctly-named ones
#   (the base file's dead `ENVIRONMENT`/`CORS_ALLOWED_ORIGINS` keys remain
#   in docker-compose.yml itself, untouched, per instructions not to modify
#   that file - they're simply ignored by the app either way).
#   `CORS_ORIGINS`/`NEXT_PUBLIC_API_URL` point at the Server PC's own
#   LAN IP, not localhost, since other machines (reception desk, TV
#   display) reach it that way - same pattern already documented in
#   docs/LOCAL_DEPLOYMENT.md for the non-Docker Windows-service install.
#   Overridable via CLINIC_FRONTEND_ORIGIN / CLINIC_API_BASE_URL env vars so
#   this file itself never needs editing per-machine.
#
# - backend.environment.DATABASE_URL - overrides the base file's hardcoded
#   connection string (which points at the dev `connectph_dev` database and
#   embeds its password in plaintext, committed to git) with the real
#   clinic database name (`canora_clinic`) and a password sourced from
#   `${POSTGRES_PASSWORD}` - a Compose variable substitution, resolved from
#   a project-root `.env` file (see `.env.example`) that stays untracked on
#   each clinic machine. The `:?...` form fails the `docker compose` command
#   loudly if that `.env` is missing/incomplete, rather than silently
#   falling back to a wrong or insecure default. This does NOT change the
#   actual password stored in the already-initialized `postgres_data`
#   volume - only how the value is supplied to the backend container; the
#   real password value itself is unchanged.
#
# - frontend.environment.HOSTNAME - the Next.js "standalone" server (see
#   `next.config.ts`'s `output: "standalone"`) binds only to what
#   `HOSTNAME` tells it to; without this it can default to a loopback-only
#   bind, unreachable from other clinic machines (reception desk, TV
#   display) on the LAN. `0.0.0.0` binds all interfaces.
#
# - frontend.healthcheck.test: !override [...] - the base file's own
#   `healthcheck.test` (still `http://localhost:3000/`) takes precedence
#   over `Dockerfile.frontend`'s baked-in HEALTHCHECK instruction when
#   running via `docker compose` - so fixing only the Dockerfile has no
#   effect under Compose. `test` is a sequence field, so (same reasoning as
#   `backend.volumes` above) a plain override list would just append, not
#   replace - `!override` here forces a full replacement with the
#   `127.0.0.1`-based command instead. Every other healthcheck setting
#   (interval/timeout/retries/start_period) is left to merge normally,
#   inherited unchanged from the base file.
#
# - postgres.ports / redis.ports: !reset [] - removes host-port publishing
#   (5432/6379) for both. This does NOT affect the backend's connectivity -
#   it reaches both via the internal Compose network (`postgres:5432`,
#   `redis:6379`) regardless of host-port publishing - and does NOT affect
#   their named volumes, images, environment, or healthchecks (all
#   inherited unchanged from the base file; only `ports` is overridden
#   here). It only stops both from being reachable from elsewhere on the
#   clinic LAN.
#
# Deliberately NOT touched here: postgres and redis otherwise stay exactly
# as defined in the base file - same images, never rebuilt or recreated by
# an app-code deploy. Nothing in this file can delete or reset their data.
#
# - EXTERNAL production volumes (below) - live-verified read-only evidence
#   from the actual Canora Server PC showed its already-running stack was
#   created under Compose project name "docker" (the literal name of the
#   `docker/` directory containing the compose files, NOT the repo root -
#   i.e. someone once ran `docker compose` from inside `docker/` rather
#   than the repo root), giving its real, already-populated volumes the
#   names `docker_postgres_data` / `docker_redis_data` /
#   `docker_backend_var_data`. An earlier version of this file pinned a
#   brand-new literal name (`canora_postgres_data` etc.) instead - WRONG,
#   because pinning a name that doesn't match what's already running would
#   have made Compose create a fresh, EMPTY volume under the new name
#   rather than reusing the real database. That mistake never reached the
#   Server PC and is corrected here before ever being used.
#
#   The fix is `external: true` with `name: ${POSTGRES_VOLUME_NAME:?...}` -
#   NOT a hardcoded name (this repo may serve more than one clinic, and a
#   hardcoded name would misdirect - or silently fabricate a fresh volume
#   for - every install that doesn't happen to use these exact
#   already-existing names). `external: true` is the actual point: it
#   tells Compose this volume MUST already exist and must NEVER be created,
#   renamed, or recreated by `docker compose` itself - if the named volume
#   is missing, every `build`/`up`/`config` command fails outright with a
#   clear Compose error instead of silently fabricating a fresh, empty
#   replacement. The `${VAR:?message}` form additionally fails loudly if
#   the project-root `.env` doesn't define the variable at all, rather than
#   silently falling back to nothing. Each clinic's own root `.env` (never
#   tracked, see `.env.example`) supplies its own already-existing volume
#   names - this file itself never needs editing per-machine, and never
#   encodes any one clinic's specific volume names.
#
#   `deploy.cmd`'s own `:check_volume_protection` preflight adds a second,
#   independent layer on top of this: it verifies the *running*
#   `connectph-postgres` container is actually mounted from the exact
#   volume `POSTGRES_VOLUME_NAME` names (not just that a volume with that
#   name exists somewhere) - see docs/DOCKER_UPDATE_PROCEDURE.md.
#
# Compose project `name:` is intentionally NOT pinned here (an earlier
# version of this file did) - once every persistent volume is `external`,
# the project name can no longer affect data identity at all (external
# volumes are addressed by their literal name regardless of project), so
# pinning it would only be solving an already-solved problem while adding
# a second thing to keep in sync. Container names remain safe regardless -
# every service already sets an explicit `container_name:` in the base file.

services:
  backend:
    build:
      args:
        # Passed by `deploy.cmd` (`set GIT_COMMIT=<new sha>` before `docker
        # compose build backend`) so the image bakes in exactly the commit
        # it was built from - see docker/Dockerfile.backend and
        # app/core/deploy_info.py. `${GIT_COMMIT:-unknown}` so a manual,
        # deploy.cmd-less `docker compose build` still produces a working
        # image (deploy_info.py treats "unknown" as "not set").
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes: !override
      - backend_var_data:/app/var
    environment:
      ENV: production
      CORS_ORIGINS: ${CLINIC_FRONTEND_ORIGIN:-http://192.168.68.106:3000}
      DATABASE_URL: postgresql+asyncpg://connectph:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in a project-root .env - see .env.example}@postgres:5432/canora_clinic
    # Skips the image's default `alembic upgrade head && uvicorn ...` CMD -
    # migrations are run manually/deliberately, never automatically here.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${CLINIC_API_BASE_URL:-http://192.168.68.106:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${CLINIC_API_BASE_URL:-http://192.168.68.106:8000/api/v1}
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: !override ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

volumes:
  # `external: true` - see the header comment above. These merge with the
  # base file's `postgres_data`/`redis_data` service-key declarations
  # (still used as the *key* everywhere else in both files - e.g.
  # `backend.volumes` above still says `backend_var_data:/app/var`,
  # unchanged); only the actual on-disk volume this key resolves to
  # changes, from a project-prefixed Compose-managed volume to this
  # clinic's real, already-existing, externally-managed one.
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME must be set in the project-root .env to this machine's EXISTING production Postgres volume name (find it with `docker volume ls` - never guess) - see .env.example. Refusing to let Compose create a fresh, empty volume in its place.}
  redis_data:
    external: true
    name: ${REDIS_VOLUME_NAME:?REDIS_VOLUME_NAME must be set in the project-root .env to this machine's EXISTING production Redis volume name - see .env.example.}
  backend_var_data:
    external: true
    name: ${BACKEND_VAR_VOLUME_NAME:?BACKEND_VAR_VOLUME_NAME must be set in the project-root .env to this machine's EXISTING backend var-data volume name - see .env.example.}
