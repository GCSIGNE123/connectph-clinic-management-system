version: "3.9"

# Production override for the clinic Server PC deployment (Phase 3).
#
# This file is layered ON TOP of docker/docker-compose.yml, which is
# unchanged and remains the dev-oriented base (bind mounts, dev CORS
# default, etc.). Usage (from repo root):
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml build backend frontend
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --no-deps backend frontend
#
# (deploy.cmd at the repo root runs exactly this.)
#
# What this override changes, and why (see docs/PHASE2_DEPLOYMENT_DESIGN
# notes / Phase 2 audit findings for the full reasoning):
#
# - backend.volumes: !reset [] - removes the base file's dev bind mount
#   (../backend:/app). Plain `volumes: []` does NOT do this - Compose merges
#   sequence fields by appending, not replacing, so an empty override list
#   is a no-op against a non-empty base list. The `!reset` tag (Compose
#   Specification merge control, requires Docker Compose v2.24.0+) is what
#   actually clears an inherited field instead of merging it. Without this,
#   the running container serves the HOST filesystem, not what was actually
#   baked into the image at `build` time - that defeats the entire point of
#   a Git-pull-then-rebuild deploy. In production the backend must run ONLY
#   from its built image.
#
# - backend.command - overrides the image's default CMD, which runs
#   `alembic upgrade head` before starting uvicorn. Per Phase 3
#   requirements, migrations must NEVER run automatically as part of a
#   deploy - they are a separate, deliberate, manual step. This override
#   starts uvicorn directly and skips the migration step entirely.
#
# - backend.environment: ENV / CORS_ORIGINS - these are the ACTUAL env var
#   names read by `backend/app/core/config.py`'s `Settings` (`ENV`,
#   `CORS_ORIGINS`). The base file sets `ENVIRONMENT`/`CORS_ALLOWED_ORIGINS`
#   instead, which `Settings` never reads (`extra="ignore"`) - those were
#   silently no-ops, so this override only sets the correctly-named ones
#   (the base file's dead `ENVIRONMENT`/`CORS_ALLOWED_ORIGINS` keys remain
#   in docker-compose.yml itself, untouched, per instructions not to modify
#   that file - they're simply ignored by the app either way).
#   `CORS_ORIGINS`/`NEXT_PUBLIC_API_BASE_URL` point at the Server PC's own
#   LAN IP, not localhost, since other machines (reception desk, TV
#   display) reach it that way - same pattern already documented in
#   docs/LOCAL_DEPLOYMENT.md for the non-Docker Windows-service install.
#   Overridable via CLINIC_FRONTEND_ORIGIN / CLINIC_API_BASE_URL env vars so
#   this file itself never needs editing per-machine.
#
# - backend.environment.DATABASE_URL - overrides the base file's hardcoded
#   connection string (which points at the dev `connectph_dev` database and
#   embeds its password in plaintext, committed to git) with the real
#   clinic database name (`canora_clinic`) and a password sourced from
#   `${POSTGRES_PASSWORD}` - a Compose variable substitution, resolved from
#   a project-root `.env` file (see `.env.example`) that stays untracked on
#   each clinic machine. The `:?...` form fails the `docker compose` command
#   loudly if that `.env` is missing/incomplete, rather than silently
#   falling back to a wrong or insecure default. This does NOT change the
#   actual password stored in the already-initialized `postgres_data`
#   volume - only how the value is supplied to the backend container; the
#   real password value itself is unchanged.
#
# - frontend.environment.HOSTNAME - the Next.js "standalone" server (see
#   `next.config.ts`'s `output: "standalone"`) binds only to what
#   `HOSTNAME` tells it to; without this it can default to a loopback-only
#   bind, unreachable from other clinic machines (reception desk, TV
#   display) on the LAN. `0.0.0.0` binds all interfaces.
#
# - frontend.healthcheck.test: !override [...] - the base file's own
#   `healthcheck.test` (still `http://localhost:3000/`) takes precedence
#   over `Dockerfile.frontend`'s baked-in HEALTHCHECK instruction when
#   running via `docker compose` - so fixing only the Dockerfile has no
#   effect under Compose. `test` is a sequence field, so (same reasoning as
#   `backend.volumes` above) a plain override list would just append, not
#   replace - `!override` here forces a full replacement with the
#   `127.0.0.1`-based command instead. Every other healthcheck setting
#   (interval/timeout/retries/start_period) is left to merge normally,
#   inherited unchanged from the base file.
#
# - postgres.ports / redis.ports: !reset [] - removes host-port publishing
#   (5432/6379) for both. This does NOT affect the backend's connectivity -
#   it reaches both via the internal Compose network (`postgres:5432`,
#   `redis:6379`) regardless of host-port publishing - and does NOT affect
#   their named volumes, images, environment, or healthchecks (all
#   inherited unchanged from the base file; only `ports` is overridden
#   here). It only stops both from being reachable from elsewhere on the
#   clinic LAN.
#
# Deliberately NOT touched here: postgres and redis otherwise stay exactly
# as defined in the base file - same images, same named volumes
# (postgres_data/redis_data), never rebuilt or recreated by an app-code
# deploy. Nothing in this file can delete or reset their data.

services:
  backend:
    volumes: !reset []
    environment:
      ENV: production
      CORS_ORIGINS: ${CLINIC_FRONTEND_ORIGIN:-http://192.168.68.106:3000}
      DATABASE_URL: postgresql+asyncpg://connectph:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in a project-root .env - see .env.example}@postgres:5432/canora_clinic
    # Skips the image's default `alembic upgrade head && uvicorn ...` CMD -
    # migrations are run manually/deliberately, never automatically here.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${CLINIC_API_BASE_URL:-http://192.168.68.106:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${CLINIC_API_BASE_URL:-http://192.168.68.106:8000/api/v1}
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: !override ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]

  postgres:
    ports: !reset []

  redis:
    ports: !reset []
