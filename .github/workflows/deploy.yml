name: Deploy

# ---------------------------------------------------------------------------
# SKELETON WORKFLOW — not yet active.
#
# This workflow documents the intended deploy flow once deploy secrets are
# provisioned. Today, Vercel and Railway's own GitHub integrations handle
# deploys automatically on push (see docs/DEPLOYMENT.md). This file is kept
# as a scaffold for the day the team wants deploys fully driven from GitHub
# Actions (e.g. to add pre-deploy DB migration steps, smoke tests, Slack
# notifications, or manual approval gates).
#
# Required repository secrets before any of this can run for real:
#   VERCEL_TOKEN        - Vercel personal/deploy token
#   VERCEL_ORG_ID        - from `vercel link` / Vercel project settings
#   VERCEL_PROJECT_ID     - from `vercel link` / Vercel project settings
#   RAILWAY_TOKEN          - Railway project deploy token
#
# Until those secrets exist in the repo, the jobs below are left commented
# out (aside from a harmless placeholder step) so this workflow can be
# enabled/merged without accidentally failing CI on every push to main.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

